# backmerge-guard — blocks merging while back-merge PRs are unmerged.
#
# Posts a commit status (context: "backmerge-guard") on the head SHA of every
# open PR targeting main / release_*. Required via branch ruleset, so a red
# status blocks the merge.
#
# A PR targeting branch B fails while any open back-merge PR into B exists
# (back-merge PRs carry the `back-merge` label). Back-merge PRs themselves
# always pass — they are the remedy.
#
# Logic lives in .github/scripts/backmerge-guard.cjs (shared with the
# auto-backmerge workflow).
#
# pull_request_target: safe — no PR code is checked out or executed, only the
# base branch's script; works for fork PRs too.

name: backmerge-guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: backmerge-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # checks out the base branch (trusted)

      - name: Evaluate all open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const guard = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/backmerge-guard.cjs`);
            await guard({ github, context, core });
